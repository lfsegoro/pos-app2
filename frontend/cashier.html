<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    POS Mobile FSM
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >
  <!-- Load Eruda -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>
    eruda.init(); // aktifkan panel debug
  </script>

</head>

<body>

  <header>

    <h1>
      POS Mobile
    </h1>

  </header>

  <!-- VIEW Manual Price-->
<section
  id="view-price"
  class="view hidden"
>

  <h2>
    Input Harga Manual
  </h2>

  <input
  type="text"
    id="priceInput"
    class="display"
    readonly
  >

  <div
    id="priceKeypad"
    class="keypad"
  ></div>

</section>
  <!-- VIEW item ID-->

  <section

    id="view-item"
    class="view"
  >

  <div class="view-header">

  <h2>
    Input Kode Barang
  </h2>

  <button id="noIdBtn">

    w/o ID

  </button>

</div>

    <input
      type="text"
      id="itemInput"
      class="display"
      readonly
    >

    <div
      class="keypad"
      id="itemKeypad"
    ></div>

  </section>

  <!-- VIEW QTY -->

  <section
    id="view-qty"
    class="view hidden"
  >

    <h2>
      Input Quantity
    </h2>

    <input
      type="text"
      id="qtyInput"
      class="display"
      readonly
    >

    <div
      class="keypad"
      id="qtyKeypad"
    ></div>

  </section>

  <!-- CART -->

  <section id="cart">

    <h2>
      Keranjang
    </h2>

    <table>

      <thead>
<tr>

  <th>ID</th>

  <th>Item</th>

  <th>Qty</th>

  <th>Subtotal</th>

</tr>

      </thead>

      <tbody id="cartBody"></tbody>

    </table>

    <div class="total">

      Total:
      <span id="totalAmount">
        0
      </span>

    </div>

    <button id="checkoutBtn">

      Checkout

    </button>

  </section>
<!-- EDIT QTY MODAL -->

<div
  id="qtyModal"
  class="modal hidden"
>

  <div class="modal-content">

    <h3>
      Edit Quantity
    </h3>

    <input
      type="number"
      id="modalQtyInput"
    >

    <div class="modal-actions">

      <button id="saveQtyBtn">

        Save

      </button>

      <button id="deleteQtyBtn">

        Delete

      </button>

      <button id="cancelQtyBtn">

        Cancel

      </button>

    </div>

  </div>

</div>
  <script
    type="module"
    src="app.js"
  ></script>

</body>

</html>
