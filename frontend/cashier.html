<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    POS Mobile FSM
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

  <header>

    <h1>
      POS Mobile
    </h1>

  </header>

  <!-- VIEW ITEM -->

  <section
    id="view-item"
    class="view"
  >

    <h2>
      Input Kode Barang
    </h2>

    <input
      type="text"
      id="itemInput"
      class="display"
      readonly
    >

    <div
      class="keypad"
      id="itemKeypad"
    ></div>

  </section>

  <!-- VIEW QTY -->

  <section
    id="view-qty"
    class="view hidden"
  >

    <h2>
      Input Quantity
    </h2>

    <input
      type="text"
      id="qtyInput"
      class="display"
      readonly
    >

    <div
      class="keypad"
      id="qtyKeypad"
    ></div>

  </section>

  <!-- CART -->

  <section id="cart">

    <h2>
      Keranjang
    </h2>

    <table>

      <thead>

        <tr>

          <th>Item</th>

          <th>Qty</th>

          <th>Subtotal</th>

        </tr>

      </thead>

      <tbody id="cartBody"></tbody>

    </table>

    <div class="total">

      Total:
      <span id="totalAmount">
        0
      </span>

    </div>

    <button id="checkoutBtn">

      Checkout

    </button>

  </section>

  <script
    type="module"
    src="app.js"
  ></script>

</body>

</html>
